events {
    worker_connections 1024;
}

http {
    split_clients "${http_x_forwarded_for}" $target_domain {
        50% pinjampro-kelompok5.up.railway.app;
        *   pinjampro-server2.up.railway.app;
    }

    server {
        listen 80;
        server_name localhost;

        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        location / {
            proxy_pass https://$target_domain$request_uri;

            proxy_ssl_server_name on;
            
            proxy_set_header Host $target_domain;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header X-Served-By $target_domain always;
        }
    }
}